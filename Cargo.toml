[package]
name = "heicdrop"
version = "1.0.0"
edition = "2024"
description = "Convertisseur d'images simple (HEIC, HEIF, PNG, JPEG…) vers JPEG, PNG, PDF, WEBP, TIFF, BMP, GIF"
license = "MIT"
readme = "README.md"
build = "build.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["rayon", "bmp", "gif", "ico", "jpeg", "png", "pnm", "tga", "tiff", "webp", "qoi", "dds", "hdr"] }
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_17"] }
rayon = "1.12.0"
rfd = "0.18.0"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
