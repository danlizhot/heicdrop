name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour publier la Release sur un tag

env:
  CARGO_TERM_COLOR: always
  VCPKGRS_DYNAMIC: "1"
  VCPKGRS_TRIPLET: x64-windows
  # Incrémenter pour forcer la reconstruction du cache vcpkg
  VCPKG_CACHE_KEY: libheif-de265-v1

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg (libheif + libde265)
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ env.VCPKG_CACHE_KEY }}-${{ runner.os }}

      - name: Installer libheif (décodeur HEVC libde265, sans x265)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: vcpkg install "libheif[core,libde265]:x64-windows"

      - name: Configurer l'environnement
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" >> $env:GITHUB_PATH

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: Compilation
        run: cargo build --release

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Archive portable (.zip)
        shell: pwsh
        run: |
          $dir = "dist\HeicDrop"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target\release\heicdrop.exe $dir\HeicDrop.exe
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" $dir
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, docs\GUIDE_UTILISATEUR.md $dir
          Compress-Archive -Path $dir -DestinationPath "dist\HeicDrop-${{ steps.ver.outputs.version }}-windows-x64.zip" -Force

      - name: Paquet MSIX
        shell: pwsh
        env:
          # Facultatif : remplace l'identité Store inscrite dans packaging/build-msix.ps1
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $p = @{ Version = "${{ steps.ver.outputs.version }}.0" }
          if ($env:MSIX_IDENTITY_NAME) { $p.IdentityName = $env:MSIX_IDENTITY_NAME }
          if ($env:MSIX_PUBLISHER) { $p.Publisher = $env:MSIX_PUBLISHER }
          if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $p.PublisherDisplayName = $env:MSIX_PUBLISHER_DISPLAY_NAME }
          .\packaging\build-msix.ps1 @p

      - uses: actions/upload-artifact@v4
        with:
          name: HeicDrop-${{ steps.ver.outputs.version }}
          path: |
            dist/*.zip
            dist/*.msix

      # Publie automatiquement la version de Cargo.toml si son tag n'existe pas encore
      # (envoi sur main), ou à la création manuelle d'un tag v*.
      - name: Version déjà publiée ?
        id: published
        shell: pwsh
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          $exists = git ls-remote --tags origin "refs/tags/$tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "exists=$([bool]$exists)".ToLower() >> $env:GITHUB_OUTPUT

      - name: Publier la Release GitHub
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.published.outputs.exists != 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.published.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: HeicDrop ${{ steps.ver.outputs.version }}
          files: |
            dist/*.zip
            dist/*.msix
          generate_release_notes: true
